services:
  bd-pyspark-jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: bd-pyspark-jupyter-lab
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-apps:/home/jovyan/spark-apps
      - ./data:/home/jovyan/data
      - ./pdfs:/home/jovyan/pdfs
      - ./image:/home/jovyan/image

  bd-spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: bd-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data

  bd-spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-1
    depends_on:
      - bd-spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data

  bd-spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-2
    depends_on:
      - bd-spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data

  bd-spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: bd-spark-history-server
    depends_on:
      - bd-spark-master
    ports:
      - "18081:18081"
    volumes:
      - /tmp/spark-events-local:/tmp/spark-events
