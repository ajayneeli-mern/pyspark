services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: bd-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: bd-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  bd-pyspark-jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: easewithdata/pyspark-jupyter-lab-old:latest
    container_name: bd-pyspark-jupyter-lab
    restart: unless-stopped
    working_dir: /home/jupyter/
    depends_on:
      bd-spark-master:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8888:8888"
      - "4040-4045:4040-4045"
      - "38000:38000"
      - "38001:38001"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
      - SPARK_HOME=/spark
      - PATH=/spark/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/local/bin/python
    volumes:
      - ./notebooks:/home/jupyter/notebooks
      - ./spark-apps:/home/jupyter/spark-apps
      - ./data:/home/jupyter/data
      - ./data:/opt/data
      - ./pdfs:/home/jupyter/pdfs
      - ./image:/home/jupyter/image
      - ./docs:/home/jupyter/docs
      - ./data/spark-events:/tmp/spark-events
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  bd-spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: bd-spark-master
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - PATH=/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks
      - ./data/spark-events:/tmp/spark-events
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  bd-spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-1
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  bd-spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-2
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

  bd-spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: bd-spark-history-server
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "18081:18081"
    volumes:
      - ./data/spark-events:/tmp/spark-events
      - ./config/spark-defaults.conf:/spark/conf/spark-defaults.conf:ro

volumes:
  kafka-data:
