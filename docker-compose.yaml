services:
  bd-pyspark-jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: bd-pyspark-jupyter-lab
    restart: unless-stopped
    working_dir: /home/jovyan/notebooks
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./spark-apps:/home/jovyan/spark-apps
      - ./data:/home/jovyan/data
      - ./pdfs:/home/jovyan/pdfs
      - ./image:/home/jovyan/image
      - ./docs:/home/jovyan/docs

  bd-spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: bd-spark-master
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7077'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  bd-spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-1
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks

  bd-spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: bd-spark-worker-2
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      - SPARK_MASTER=spark://bd-spark-master:7077
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/opt/data
      - ./notebooks:/opt/notebooks

  bd-spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: bd-spark-history-server
    restart: unless-stopped
    depends_on:
      bd-spark-master:
        condition: service_healthy
    ports:
      - "18081:18081"
    volumes:
      - /tmp/spark-events-local:/tmp/spark-events
